<!DOCTYPE html>
<html>
<head>
    <title>Earthquake Map Visualization</title>
    <!-- นำเข้าฟอนต์ TH Sarabun New -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        /* โครงสร้างพื้นฐานของโหนดแผ่นดินไหว */
        .earthquake-node {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; /* สำหรับจัดตำแหน่งตัวเลขให้อยู่บนไอคอน */
            cursor: pointer; /* แสดงไอคอนรูปมือเมื่อเลื่อนเมาส์มาชี้ */
            transition: transform 0.2s ease;
        }

        /* รูปภาพไอคอน custom */
        .earthquake-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* เอฟเฟกต์เมื่อเอาเมาส์ไปชี้ที่จุด (Hover) */
        .earthquake-node:hover {
            transform: scale(1.15);
        }

        /* ตัวเลขแมกนิจูด ฟอนต์ TH Sarabun New วางซ้อนทับกลางไอคอน */
        .magnitude-label {
            position: absolute;
            font-family: 'TH Sarabun New', sans-serif;
            font-weight: bold;
            font-size: 22px;
            color: #FFFFFF;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            user-select: none;
            line-height: 1;
            pointer-events: none; /* เพื่อให้เหตุการณ์คลิกทะลุไปที่รูปภาพไอคอนด้านหลัง */
        }

        /* เอฟเฟกต์แอนิเมชันกระพริบขยายขนาดวนลูป (Pulse) */
        @keyframes pulse-animation {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.25);
                opacity: 0.3;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Class บังคับเล่นแอนิเมชันต่อเนื่อง */
        .pulsing {
            animation: pulse-animation 1.2s infinite ease-in-out !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        async function initMap() {
            // โหลด Map และ Marker Library จาก Google Maps API
            const { Map } = await google.maps.importLibrary("maps");
            const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

            const map = new Map(document.getElementById("map"), {
                zoom: 5,
                center: { lat: 15.0, lng: 101.0 },
                mapId: "DEMO_MAP_ID", // ใช้ DEMO_MAP_ID สำหรับการทดสอบ
            });

            // ข้อมูลตำแหน่งแผ่นดินไหว 3 จุด พร้อม URL ไอคอนรูปภาพที่คุณกำหนดเอง
            const earthquakes = [
                { 
                    lat: 18.788, 
                    lng: 98.985, 
                    mag: 3.2, 
                    title: "เหตุการณ์แผ่นดินไหวขนาด 3.2",
                    url: "https://earthquake.tmd.go.th/",
                    // สามารถระบุไฟล์ไอคอนส่วนตัวได้ เช่น "assets/icon-green.png"
                    icon: "https://maps.google.com/mapfiles/ms/icons/green-dot.png" 
                },
                { 
                    lat: 14.200, 
                    lng: 99.500, 
                    mag: 5.5, 
                    title: "เหตุการณ์แผ่นดินไหวขนาด 5.5",
                    url: "https://earthquake.usgs.gov/",
                    icon: "https://maps.google.com/mapfiles/ms/icons/orange-dot.png" 
                },
                { 
                    lat: 10.500, 
                    lng: 95.000, 
                    mag: 7.8, 
                    title: "เหตุการณ์แผ่นดินไหวรุนแรงขนาด 7.8",
                    url: "https://www.google.com",
                    icon: "../imgH/mapicons/clustR1a.png" 
                }
            ];

            earthquakes.forEach((eq) => {
                const sizePx = Math.max(eq.mag * 8, 30); // คำนวณขนาดความกว้าง/สูงของไอคอนตามแมกนิจูด (px)
                const isLarge = eq.mag >= 7.0;

                // 1. สร้าง Custom HTML Element สำหรับรองรับไอคอน
                const nodeEl = document.createElement("div");
                nodeEl.className = "earthquake-node";
                nodeEl.style.width = `${sizePx}px`;
                nodeEl.style.height = `${sizePx}px`;
                nodeEl.title = `${eq.title} (คลิกเพื่อดูรายละเอียด)`;

                // 2. สร้าง Element <img> เพื่อแสดงภาพไอคอนที่กำหนดเอง
                const imgEl = document.createElement("img");
                imgEl.src = eq.icon;
                imgEl.className = "earthquake-icon";
                imgEl.alt = eq.title;
                nodeEl.appendChild(imgEl);

                // 3. ใส่ตัวเลขแมกนิจูดทับไว้บนไอคอน
                const labelEl = document.createElement("span");
                labelEl.className = "magnitude-label";
                labelEl.innerText = eq.mag.toFixed(1);
                nodeEl.appendChild(labelEl);

                // 4. ถ้าเป็นจุดใหญ่ ให้ใส่ Class กระพริบ
                if (isLarge) {
                    nodeEl.classList.add("pulsing");
                }

                // 5. เพิ่ม Event Listener เมื่อผู้ใช้กดคลิกที่ไอคอน ให้เปิด URL ในแท็บใหม่
                nodeEl.addEventListener("click", () => {
                    if (eq.url) {
                        window.open(eq.url, "_blank");
                    }
                });

                // 6. แสดงผลลงบนแผนที่ผ่าน AdvancedMarkerElement
                new AdvancedMarkerElement({
                    map: map,
                    position: { lat: eq.lat, lng: eq.lng },
                    content: nodeEl,
                });
            });
        }
    </script>

    <!-- ใส่ API Key ของคุณใน YOUR_API_KEY -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC5l0aPyGFqiqY5DpqOYf-8YhN_eYHHobU&callback=initMap"
    async defer></script>

</body>
</html>

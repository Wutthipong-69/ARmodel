<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Gaming Interface - 3DPN-1341</title>
    
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/ar.js/master/aframe/build/aframe-ar.js"></script>
    <!-- A-Frame Extras for animation/movement -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        /* Gaming UI Styling */
        #ui-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* ให้คลิกทะลุไปที่ AR ได้ */
            z-index: 10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hud-header {
            position: absolute;
            top: 20px; width: 100%;
            text-align: center;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .hud-footer {
            position: absolute;
            bottom: 30px; width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }
        .status-bar {
            position: absolute;
            bottom: 100px; left: 50%;
            transform: translateX(-50%);
            width: 80%; height: 5px;
            background: rgba(0, 255, 204, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        .status-progress {
            width: 70%; height: 100%;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- Gaming UI Overlay -->
    <div id="ui-layer">
        <div class="hud-header">SYSTEM READY: 3DPN-1341</div>
        <div class="status-bar"><div class="status-progress"></div></div>
        <div class="hud-footer">DRAG OBJECT TO REPOSITION | SCAN MARKER TO INITIALIZE</div>
    </div>

    <!-- AR Scene -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable">

        <!-- Assets Management -->
        <a-assets>
            <a-asset-item id="model-3dpn" src="banana.glb"></a-asset-item>
        </a-assets>

        <!-- Marker-based Tracking (ใช้ Hiro Marker เป็นตัวอย่าง) -->
        <!-- คุณสามารถเปลี่ยน preset เป็น pattern อื่นๆ ได้ -->
        <a-marker preset="hiro" id="main-marker">
            
            <!-- The 3D Model Entity -->
            <a-entity 
                id="target-model"
                class="clickable"
                gltf-model="#model-3dpn"
                scale="1 1 1"
                position="0 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
                drag-controls>
            </a-entity>

            <!-- Ground Shadow/Base for Gaming Look -->
            <a-plane rotation="-90 0 0" width="2" height="2" material="color: #00ffcc; opacity: 0.2; transparent: true"></a-plane>
        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <!-- JavaScript: Drag & Drop Logic -->
    <script>
        AFRAME.registerComponent('drag-controls', {
            init: function () {
                this.el.addEventListener('mousedown', this.onDragStart.bind(this));
                this.el.addEventListener('touchstart', this.onDragStart.bind(this));
                
                window.addEventListener('mousemove', this.onDragMove.bind(this));
                window.addEventListener('touchmove', this.onDragMove.bind(this));
                
                window.addEventListener('mouseup', this.onDragEnd.bind(this));
                window.addEventListener('touchend', this.onDragEnd.bind(this));

                this.isDragging = false;
                this.offset = new THREE.Vector3();
            },

            onDragStart: function (evt) {
                // ตรวจสอบว่าเป็นการคลิกที่ตัววัตถุโดยตรงหรือไม่
                if (evt.target.classList.contains('clickable')) {
                    this.isDragging = true;
                    // ใน AR.js การขยับวัตถุต้องระวังเรื่อง Local Coordinate ของ Marker
                    // เราจะใช้การขยับตำแหน่ง relative ภายใน Marker
                }
            },

            onDragMove: function (evt) {
                if (!this.isDragging) return;

                // คำนวณตำแหน่งใหม่ผ่าน Raycaster ของ A-Frame
                // เพื่อความง่ายในการทำ AR เราจะขยับตามทิศทางของ Mouse/Touch
                const sceneEl = this.el.sceneEl;
                const camera = sceneEl.camera;
                
                // คำนวณตำแหน่งเป้าหมายบนระนาบ XZ (พื้น)
                // หมายเหตุ: ในระบบ Marker การขยับวัตถุออกจากศูนย์กลางอาจทำให้ Marker หลุดได้
                // แต่เทคนิคนี้จะช่วยให้ขยับภายในพื้นที่ของ Marker ได้
                let touchX = evt.clientX || evt.touches[0].clientX;
                let touchY = evt.clientY || evt.touches[0].clientY;

                // จำลองการขยับแบบง่าย (Simplified for AR context)
                let currentPos = this.el.getAttribute('position');
                let sensitivity = 0.01;
                
                // คำนวณการขยับตามการลาก (Mouse movement delta)
                if (evt.movementX) {
                    currentPos.x += evt.movementX * sensitivity;
                    currentPos.z += evt.movementY * sensitivity;
                }

                this.el.setAttribute('position', currentPos);
            },

            onDragEnd: function () {
                this.isDragging = false;
            }
        });
    </script>
</body>
</html>

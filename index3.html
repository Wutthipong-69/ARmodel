<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR 3D Interactive Model Viewer</title>

  <!-- A-Frame Version 1.2.0 -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      touch-action: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    /* -------------------------------------------------------------
       ปรับแต่ง Sidebar ด้านข้างสำหรับเก็บแผงควบคุม UI ทั้งหมด
    ------------------------------------------------------------- */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 280px;
      max-width: 80%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      transform: translateX(-100%); /* ซ่อนไว้ทางซ้ายโดยเริ่มต้น */
      transition: transform 0.3s ease-in-out;
      display: flex;
      flex-direction: column;
      padding: 20px 15px;
      box-sizing: border-box;
      gap: 15px;
      overflow-y: auto;
      color: white;
    }

    #sidebar.active {
      transform: translateX(0); /* ขยายออกมาเมื่อมี class 'active' */
    }

    /* ปุ่มสำหรับสลับซ่อน/แสดง Sidebar */
    #sidebar-toggle-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1001;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }

    #ui-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      width: 100%;
    }

    .btn-main {
      background: #e91e63;
      font-size: 18px;
      padding: 15px 30px;
      border-radius: 30px;
      margin-top: 15px;
      width: auto;
    }

    .btn-secondary {
      background: #2196F3;
    }

    /* สไตล์ปุ่มลบโมเดล */
    .btn-delete {
      background: #f44336;
    }

    .btn-mode {
      background: #9c27b0;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 12px;
      width: 100%;
    }

    #bottom-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .slider-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .slider-group label {
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    #scale-slider {
      width: 100%;
      accent-color: #FF9800;
      cursor: pointer;
    }

    .mode-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      width: 100%;
    }

    .mode-label {
      color: #ddd;
      font-size: 11px;
    }

    /* สไตล์สำหรับปุ่มควบคุมทิศทาง (D-Pad) */
    .dpad-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .dpad-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-dpad {
      background: #ff9800;
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    .btn-dpad:active {
      background: #e68a00;
      transform: scale(0.95);
    }

    hr {
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      width: 100%;
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <!-- Overlay สำหรับเปิดใช้งานกล้อง -->
  <div id="start-overlay">
    <h2>แอพพลิเคชัน AR 3D Viewer</h2>
    <p>กดปุ่มด้านล่างเพื่อเปิดกล้องส่อง Hiro Marker</p>
    <button class="btn btn-main" id="start-btn">📷 เริ่มใช้งานกล้อง</button>
  </div>

  <!-- ปุ่มไอคอนเปิด/ปิด Sidebar แผงควบคุมด้านข้าง -->
  <button id="sidebar-toggle-btn" onclick="toggleSidebar()">⚙️</button>

  <!-- Sidebar สำหรับเก็บคอนโทรลเลอร์ควบคุมทั้งหมด -->
  <div id="sidebar">
    <h3 style="margin: 0 0 10px 0; text-align: center;">⚙️ แผงควบคุม</h3>

    <!-- ปุ่ม GUI ควบคุม -->
    <div id="ui-container">
      <button class="btn" onclick="spawnModel('banana')">🍌 เพิ่ม Banana</button>
      <button class="btn btn-secondary" onclick="spawnModel('kitchen')">🍳 เพิ่ม Kitchen</button>
      <!-- ปุ่มสำหรับลบโมเดลล่าสุด -->
      <button class="btn btn-delete" onclick="removeLastModel()">🗑️ ลบโมเดลล่าสุด</button>
    </div>

    <hr>

    <!-- แผงปรับขนาด + สลับโหมด + ปุ่มลูกศรควบคุมทิศทาง -->
    <div id="bottom-panel">
      <div class="slider-group">
        <label for="scale-slider">🔍 ปรับขนาดโมเดลที่เลือก</label>
        <input type="range" id="scale-slider" min="0.05" max="1.5" step="0.02" value="0.2">
      </div>
      
      <div class="mode-group">
        <span class="mode-label">โหมดนิ้วเดียวลาก:</span>
        <button class="btn btn-mode" id="mode-btn" onclick="toggleDragMode()">✋ เคลื่อนย้าย (Move)</button>
      </div>

      <!-- แผงปุ่มลูกศรควบคุมเคลื่อนย้าย (ขึ้น-ลง-ซ้าย-ขวา) -->
      <div class="dpad-container">
        <div class="dpad-row">
          <button class="btn-dpad" onclick="moveActiveObject('up')">⬆️</button>
        </div>
        <div class="dpad-row">
          <button class="btn-dpad" onclick="moveActiveObject('left')">⬅️</button>
          <button class="btn-dpad" onclick="moveActiveObject('down')">⬇️</button>
          <button class="btn-dpad" onclick="moveActiveObject('right')">➡️</button>
        </div>
      </div>
    </div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- Preload Assets -->
    <a-assets>
      <a-asset-item id="banana-model" src="3_musium1.glb"></a-asset-item>
      <a-asset-item id="kitchen-model" src="Duck.glb"></a-asset-item>
    </a-assets>

    <!-- Camera -->
    <a-entity camera id="main-camera"></a-entity>

    <!-- Light -->
    <a-entity light="type: ambient; intensity: 1.0;"></a-entity>
    <a-entity light="type: directional; intensity: 0.8;" position="1 4 2"></a-entity>

    <!-- HIRO MARKER TRACKING -->
    <a-marker preset="hiro" id="hiro-marker">
    </a-marker>

    <!-- Container สำหรับโมเดล Free Placement -->
    <a-entity id="world-container" position="0 0 -2"></a-entity>

  </a-scene>

  <script>
    let activeSelectedObject = null;
    let currentDragMode = 'move';
    let spawnedModels = []; // อาเรย์สำหรับเก็บอ้างอิงโมเดลที่สร้างขึ้นมาใหม่

    // -------------------------------------------------------------
    // ฟังก์ชัน ซ่อน/แสดง แผงควบคุม Sidebar
    // -------------------------------------------------------------
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('sidebar-toggle-btn');
      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        toggleBtn.innerHTML = '❌';
      } else {
        toggleBtn.innerHTML = '⚙️';
      }
    }

    // -------------------------------------------------------------
    // 1. ระบบกระตุ้นวิดีโอกล้อง และสร้างโมเดลเริ่มต้น
    // -------------------------------------------------------------
    document.getElementById('start-btn').addEventListener('click', function() {
      document.getElementById('start-overlay').style.display = 'none';
      const video = document.querySelector('video');
      if (video) {
        video.play();
      }
      
      // สร้างโมเดลเริ่มต้นเมื่อผู้ใช้กดเริ่มกล้อง
      if (spawnedModels.length === 0) {
        spawnModel('banana');
      }
    });

    // -------------------------------------------------------------
    // 2. Component ควบคุมสัมผัส (ปรับปรุงระบบTouch ให้เคลื่อนย้ายเสถียร)
    // -------------------------------------------------------------
    AFRAME.registerComponent('ar-touch-controls', {
      init: function () {
        this.isDragging = false;
        this.previousTouchPos = { x: 0, y: 0 };

        activeSelectedObject = this.el;

        window.addEventListener('touchstart', this.onTouchStart.bind(this), { passive: false });
        window.addEventListener('touchmove', this.onTouchMove.bind(this), { passive: false });
        window.addEventListener('touchend', this.onTouchEnd.bind(this));

        this.el.addEventListener('mousedown', this.onMouseDown.bind(this));
        window.addEventListener('mousemove', this.onMouseMove.bind(this));
        window.addEventListener('mouseup', this.onMouseUp.bind(this));
      },

      onTouchStart: function (evt) {
        // หากผู้ใช้สัมผัสส่วนเมนู Sidebar หรือปุ่มเปิดปิด ให้ไม่เริ่มลากโมเดล
        if (evt.target.closest('#sidebar') || evt.target.closest('#sidebar-toggle-btn')) {
          return;
        }

        if (evt.touches.length === 1) {
          this.isDragging = true;
          activeSelectedObject = this.el;
          this.previousTouchPos = { x: evt.touches[0].clientX, y: evt.touches[0].clientY };
          updateSliderValue(this.el.object3D.scale.x);
        }
      },

      onTouchMove: function (evt) {
        if (evt.touches.length === 1 && this.isDragging && activeSelectedObject === this.el) {
          evt.preventDefault();
          let touch = evt.touches[0];
          let deltaX = touch.clientX - this.previousTouchPos.x;
          let deltaY = touch.clientY - this.previousTouchPos.y;
          
          if (currentDragMode === 'move') {
            // คำนวณเคลื่อนย้ายตำแหน่งพิกัด X และ Y โดยตรง
            this.el.object3D.position.x += deltaX * 0.005;
            this.el.object3D.position.y -= deltaY * 0.005;
          } else if (currentDragMode === 'rotate') {
            // หมุนโมเดล
            this.el.object3D.rotation.y += deltaX * 0.015;
            this.el.object3D.rotation.x += deltaY * 0.015;
          }

          this.previousTouchPos = { x: touch.clientX, y: touch.clientY };
        }
      },

      onTouchEnd: function (evt) {
        if (evt.touches.length === 0) {
          this.isDragging = false;
        }
      },

      onMouseDown: function (evt) {
        if (evt.target.closest('#sidebar') || evt.target.closest('#sidebar-toggle-btn')) {
          return;
        }
        this.isDragging = true;
        activeSelectedObject = this.el;
        this.previousTouchPos = { x: evt.clientX, y: evt.clientY };
        updateSliderValue(this.el.object3D.scale.x);
      },

      onMouseMove: function (evt) {
        if (this.isDragging && activeSelectedObject === this.el) {
          let deltaX = evt.clientX - this.previousTouchPos.x;
          let deltaY = evt.clientY - this.previousTouchPos.y;

          if (currentDragMode === 'move') {
            this.el.object3D.position.x += deltaX * 0.005;
            this.el.object3D.position.y -= deltaY * 0.005;
          } else {
            this.el.object3D.rotation.y += deltaX * 0.015;
            this.el.object3D.rotation.x += deltaY * 0.015;
          }
          this.previousTouchPos = { x: evt.clientX, y: evt.clientY };
        }
      },

      onMouseUp: function () {
        this.isDragging = false;
      }
    });

    // -------------------------------------------------------------
    // 3. ปุ่มกดสลับโหมดการลาก (Move / Rotate)
    // -------------------------------------------------------------
    function toggleDragMode() {
      const btn = document.getElementById('mode-btn');
      if (currentDragMode === 'move') {
        currentDragMode = 'rotate';
        btn.innerHTML = '🔄 หมุนวัตถุ (Rotate)';
        btn.style.background = '#FF5722';
      } else {
        currentDragMode = 'move';
        btn.innerHTML = '✋ เคลื่อนย้าย (Move)';
        btn.style.background = '#9c27b0';
      }
    }

    // -------------------------------------------------------------
    // 4. Slider ปรับขนาดวัตถุ
    // -------------------------------------------------------------
    const slider = document.getElementById('scale-slider');
    
    slider.addEventListener('input', function() {
      if (activeSelectedObject) {
        let val = parseFloat(this.value);
        activeSelectedObject.object3D.scale.set(val, val, val);
      }
    });

    function updateSliderValue(val) {
      slider.value = val;
    }

    // -------------------------------------------------------------
    // 5. ฟังก์ชันเพิ่มวัตถุใหม่ (Spawn Model)
    // -------------------------------------------------------------
    function spawnModel(type) {
      const container = document.querySelector('#world-container');
      const newEntity = document.createElement('a-entity');

      let initialScale = 0.2;
      if (type === 'banana') {
        newEntity.setAttribute('gltf-model', '#banana-model');
        initialScale = 0.2;
      } else if (type === 'kitchen') {
        newEntity.setAttribute('gltf-model', '#kitchen-model');
        initialScale = 0.08;
      }

      newEntity.setAttribute('scale', `${initialScale} ${initialScale} ${initialScale}`);
      
      const randomX = (Math.random() - 0.5) * 0.4;
      const randomY = (Math.random() - 0.5) * 0.4;
      
      newEntity.setAttribute('position', `${randomX} ${randomY} -1.5`);
      newEntity.setAttribute('class', 'clickable');
      newEntity.setAttribute('ar-touch-controls', '');

      container.appendChild(newEntity);

      // บันทึกตัวแปรโมเดลลงใน Array
      spawnedModels.push(newEntity);

      activeSelectedObject = newEntity;
      updateSliderValue(initialScale);
    }

    // -------------------------------------------------------------
    // 6. ฟังก์ชันลบโมเดลล่าสุด (Remove Last Model)
    // -------------------------------------------------------------
    function removeLastModel() {
      if (spawnedModels.length > 0) {
        const lastModel = spawnedModels.pop();
        
        if (activeSelectedObject === lastModel) {
          activeSelectedObject = null;
        }

        if (lastModel && lastModel.parentNode) {
          lastModel.parentNode.removeChild(lastModel);
        }
      }
    }

    // -------------------------------------------------------------
    // 7. ฟังก์ชันขยับพิกัดโมเดล ขึ้น-ลง-ซ้าย-ขวา
    // -------------------------------------------------------------
    function moveActiveObject(direction) {
      if (!activeSelectedObject) return;

      const step = 0.08; // ระยะการขยับต่อการกด 1 ครั้ง
      const pos = activeSelectedObject.object3D.position;

      switch(direction) {
        case 'up':
          pos.y += step;
          break;
        case 'down':
          pos.y -= step;
          break;
        case 'left':
          pos.x -= step;
          break;
        case 'right':
          pos.x += step;
          break;
      }
    }
  </script>
</body>
</html>

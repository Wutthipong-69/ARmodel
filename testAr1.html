<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PSU Payoon AR System</title>
    
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* UI Overlay Styles */
        #ui-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 300px;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 15px;
            z-index: 1000;
            font-family: sans-serif;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .slider-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        input[type=range] {
            width: 100%;
        }
        #instructions {
            position: fixed;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 0;
            z-index: 1000;
            font-family: sans-serif;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- UI Elements -->
    <div id="instructions">สแกน Hiro Marker เพื่อเริ่มแสดงโมเดล</div>
    
    <div id="ui-container">
        <label class="slider-label" for="scale-slider">ปรับขนาดโมเดล</label>
        <input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1">
    </div>

    <!-- A-Frame Scene -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debug: false; detectionMode: mono_and_matrix; matrixCodeType: most;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;">

        <!-- Assets: ใส่ URL โมเดลของคุณที่นี่ -->
        <a-assets>
            <a-asset-loader id="model-loader" url="https://raw.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb"></a-asset-loader>
        </a-assets>

        <!-- Marker: ในที่นี้ใช้ Hiro Marker -->
        <a-marker preset="hiro" id="marker">
            <!-- Model Entity -->
            <a-entity 
                id="main-model"
                gltf-model="#model-loader"
                position="0 0 0"
                scale="1 1 1"
                rotation="0 0 0"
                class="clickable">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const model = document.querySelector('#main-model');
        const slider = document.querySelector('#scale-slider');
        const marker = document.querySelector('#marker');

        // 1. ระบบปรับขนาด (Scaling) ผ่าน Slider
        slider.addEventListener('input', function (event) {
            const scaleValue = event.target.value;
            // ปรับ scale ทั้งแกน X, Y, Z ให้เท่ากัน
            model.setAttribute('scale', `${scaleValue} ${scaleValue} ${scaleValue}`);
        });

        // 2. ระบบแตะเพื่อย้ายตำแหน่ง (Movement/Positioning)
        // หมายเหตุ: ใน Marker-based AR โมเดลจะผูกกับ Marker 
        // การ "ย้าย" คือการเปลี่ยนตำแหน่งสัมพัทธ์ (Relative Position) ภายใน Marker นั้นๆ
        window.addEventListener('click', function (event) {
            // ตรวจสอบว่ามีการแตะที่ตัวโมเดลหรือไม่ (ผ่าน raycaster ของ A-Frame)
            // ในตัวอย่างนี้จะใช้การแตะที่หน้าจอเพื่อเลื่อนโมเดลไปทางซ้าย/ขวาแบบง่าย
            
            const currentPos = model.getAttribute('position');
            
            // สุ่มตำแหน่งใหม่เล็กน้อยรอบๆ จุดศูนย์กลางของ Marker เพื่อให้ดูเหมือนการเคลื่อนย้าย
            // หรือจะทำเป็นระบบ Drag ก็ได้ แต่สำหรับมือถือการ Tap/Click จะเสถียรกว่า
            const newX = currentPos.x + (Math.random() * 0.4 - 0.2);
            const newZ = currentPos.z + (Math.random() * 0.4 - 0.2);
            
            model.setAttribute('position', { x: newX, y: 0, z: newZ });
        });

        // ปรับแต่งเพื่อให้รองรับการ Touch บนสมาร์ทโฟน
        document.addEventListener('touchstart', function (event) {
            // ลอจิกการเคลื่อนที่เมื่อมีการแตะหน้าจอ
            const currentPos = model.getAttribute('position');
            // ย้ายตำแหน่งไปด้านหน้าหรือด้านข้างเล็กน้อย
            model.setAttribute('position', { 
                x: currentPos.x + 0.1, 
                y: 0, 
                z: currentPos.z 
            });
        }, {passive: true});

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PSU Payoon AR - Robust Version</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* 1. บังคับให้ Body และ HTML โปร่งใส */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent !important;
        }

        /* 2. การควบคุมเลเยอร์วิดีโอ (Camera Feed) ให้เป็นพื้นหลังเสมอ */
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            z-index: -1 !important; /* ดันลงไปใต้สุด */
            visibility: visible !important;
        }

        /* 3. การควบคุมเลเยอร์ Canvas (3D Model) ให้โปร่งใส */
        canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important; /* วางบนวิดีโอ */
            background: transparent !important; /* บังคับให้โปร่งใสเพื่อเห็นวิดีโอ */
            pointer-events: auto !important;
        }

        /* UI Elements */
        #ui-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 20px;
            z-index: 9999;
            text-align: center;
        }
        #instructions {
            position: fixed;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            padding: 5px 0;
        }
    </style>
</head>

<body>
    <div id="instructions">กรุณาอนุญาตการเข้าถึงกล้อง</div>
    
    <div id="ui-container">
        <label style="display:block; font-size: 12px;">ปรับขนาดโมเดล</label>
        <input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1" style="width:100%;">
    </div>

    <!-- 
        ปรับปรุง a-scene:
        - ใช้ sourceType: webcam
        - ไม่กำหนด background เพื่อลดความซ้ำซ้อน
    -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debug: false;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; alpha: true;"> <!-- alpha: true สำคัญมากเพื่อให้ Canvas โปร่งใส -->

        <a-assets>
            <!-- ใส่ชื่อไฟล์โมเดลที่คุณอัปโหลดไว้ใน GitHub -->
            <a-asset-loader id="model-loader" url="Banana.glb"></a-asset-loader>
        </a-assets>

        <a-marker preset="hiro" id="marker">
            <a-entity 
                id="main-model"
                gltf-model="#model-loader"
                scale="1 1 1"
                position="0 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const model = document.querySelector('#main-model');
        const slider = document.querySelector('#scale-slider');
        const instructions = document.querySelector('#instructions');

        // ตรวจสอบเมื่อโหลดเสร็จ
        window.addEventListener('load', () => {
            setTimeout(() => {
                instructions.innerText = "สแกน Hiro Marker";
            }, 2000);
        });

        // ปรับขนาด
        slider.addEventListener('input', (e) => {
            const s = e.target.value;
            model.setAttribute('scale', `${s} ${s} ${s}`);
        });

        // ระบบแตะเพื่อย้ายตำแหน่ง (Tap to move)
        window.addEventListener('touchstart', (e) => {
            if (e.target.id === 'scale-slider') return;
            
            const pos = model.getAttribute('position');
            model.setAttribute('position', { 
                x: pos.x + 0.1, 
                y: 0, 
                z: pos.z 
            });
        });
    </script>
</body>
</html>

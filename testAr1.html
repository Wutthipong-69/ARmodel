<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PSU Payoon AR Fix</title>
    
    <!-- ใช้ CDN ที่เสถียร -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        
        /* ส่วนควบคุม UI */
        #ui-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 15px;
            z-index: 9999;
            text-align: center;
        }
        #instructions {
            position: fixed;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            padding: 5px 0;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <div id="instructions">กำลังรอการเข้าถึงกล้อง... (กรุณากด Allow)</div>
    
    <div id="ui-container">
        <label style="display:block; font-size: 12px;">ปรับขนาดโมเดล</label>
        <input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1" style="width:100%;">
    </div>

    <!-- 
        หัวใจสำคัญของการแก้ปัญหา:
        1. ลบ background="..." ออกทั้งหมด เพื่อให้เห็นภาพจากกล้อง
        2. ใช้ sourceType: webcam
        3. ไม่ต้องใส่สีพื้นหลังใน a-scene
    -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debug: false; detectionMode: mono_and_matrix; matrixCodeType: most;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;">

        <a-assets>
            <!-- ใช้ไฟล์โมเดลที่คุณอัปโหลดไว้ใน GitHub โดยตรง -->
            <a-asset-loader id="model-loader" url="kitchen.glb"></a-asset-loader>
        </a-assets>

        <!-- Marker: Hiro Marker -->
        <a-marker preset="hiro" id="marker">
            <a-entity 
                id="main-model"
                gltf-model="#model-loader"
                scale="1 1 1"
                position="0 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const model = document.querySelector('#main-model');
        const slider = document.querySelector('#scale-slider');
        const instruction = document.querySelector('#instructions');

        // เมื่อโหลดหน้าเว็บเสร็จ ให้แจ้งสถานะ
        window.addEventListener('load', () => {
            instruction.innerText = "สแกน Hiro Marker เพื่อเริ่ม";
        });

        // ระบบปรับขนาด
        slider.addEventListener('input', (e) => {
            const s = e.target.value;
            model.setAttribute('scale', `${s} ${s} ${s}`);
        });

        // ระบบแตะเพื่อย้าย (Tap to move)
        window.addEventListener('touchstart', (e) => {
            if (e.target.id === 'scale-slider') return;
            
            const pos = model.getAttribute('position');
            model.setAttribute('position', { 
                x: pos.x + 0.1, 
                y: 0, 
                z: pos.z 
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR 3D Interactive Model Viewer</title>

  <!-- A-Frame Version 1.2.0 -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      touch-action: none; /* บล็อก Gesture พื้นฐานของ Browser ไม่ให้กวน AR Controls */
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    /* UI ด้านบน: ปุ่มเพิ่มวัตถุ */
    #ui-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 25px;
      backdrop-filter: blur(5px);
    }

    .btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .btn-main {
      background: #e91e63;
      font-size: 18px;
      padding: 15px 30px;
      border-radius: 30px;
      margin-top: 15px;
    }

    .btn-secondary {
      background: #2196F3;
    }

    /* UI ด้านล่าง: แถบแนวนอนสำหรับปรับขนาด (Slider Bar) */
    #scale-slider-container {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 80%;
      max-width: 320px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 20px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(5px);
    }

    #scale-slider-container label {
      color: white;
      font-size: 13px;
      font-weight: bold;
    }

    #scale-slider {
      width: 100%;
      accent-color: #FF9800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Overlay เปิดกล้อง -->
  <div id="start-overlay">
    <h2>แอพพลิเคชัน AR 3D Viewer</h2>
    <p>กดปุ่มด้านล่างเพื่อเริ่มใช้งาน AR</p>
    <button class="btn btn-main" id="start-btn">📷 เริ่มใช้งานกล้อง</button>
  </div>

  <!-- UI ปุ่มเพิ่มวัตถุ -->
  <div id="ui-container">
    <button class="btn" onclick="spawnModel('banana')">🍌 เพิ่ม Banana</button>
    <button class="btn btn-secondary" onclick="spawnModel('kitchen')">🍳 เพิ่ม Kitchen</button>
  </div>

  <!-- แถบแนวนอนปรับขนาดวัตถุ (Slider Control) -->
  <div id="scale-slider-container">
    <label for="scale-slider">🔍 ปรับขนาดโมเดลที่เลือก</label>
    <input type="range" id="scale-slider" min="0.05" max="1.5" step="0.02" value="0.2">
  </div>

  <!-- A-Frame Scene -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best; sourceWidth:1280; sourceHeight:720; displayWidth:1280; displayHeight:720;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- Preload Assets -->
    <a-assets>
      <a-asset-item id="banana-model" src="Banana.glb"></a-asset-item>
      <a-asset-item id="kitchen-model" src="kitchen.glb"></a-asset-item>
    </a-assets>

    <!-- Camera -->
    <a-entity camera id="main-camera"></a-entity>

    <!-- Light -->
    <a-entity light="type: ambient; intensity: 0.9;"></a-entity>
    <a-entity light="type: directional; intensity: 0.6;" position="1 4 2"></a-entity>

    <!-- Hiro Marker -->
    <a-marker preset="hiro" id="hiro-marker">
      <a-entity 
        id="marker-banana"
        gltf-model="#banana-model" 
        scale="0.2 0.2 0.2" 
        position="0 0 0"
        class="clickable"
        ar-touch-controls>
      </a-entity>
    </a-marker>

    <!-- Container สำหรับ Free Placement -->
    <a-entity id="world-container" position="0 0 -2"></a-entity>

  </a-scene>

  <script>
    // ตัวแปรเก็บวัตถุสามมิติตัวล่าสุดที่ผู้ใช้กดเลือก/ใช้งานอยู่
    let activeSelectedObject = null;

    // -------------------------------------------------------------
    // 1. ระบบจัดการ Permission กล้อง
    // -------------------------------------------------------------
    document.getElementById('start-btn').addEventListener('click', function() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(function(stream) {
          stream.getTracks().forEach(track => track.stop());
          document.getElementById('start-overlay').style.display = 'none';
        })
        .catch(function() {
          document.getElementById('start-overlay').style.display = 'none';
        });
      } else {
        document.getElementById('start-overlay').style.display = 'none';
      }
    });

    // -------------------------------------------------------------
    // 2. Component สำหรับลากเคลื่อนที่ 3D (แนวดิ่ง/แนวนอน) และ Pinch-to-Zoom
    // -------------------------------------------------------------
    AFRAME.registerComponent('ar-touch-controls', {
      init: function () {
        this.isDragging = false;
        this.initialPinchDistance = null;
        this.baseScale = { x: 0.2, y: 0.2, z: 0.2 };
        this.camera = document.querySelector('#main-camera').object3D;

        // ผูก Event Listeners การสัมผัสเข้ากับ Window โดยตรงเพื่อความแม่นยำเวลาลากหลุดวัตถุ
        window.addEventListener('touchstart', this.onTouchStart.bind(this), { passive: false });
        window.addEventListener('touchmove', this.onTouchMove.bind(this), { passive: false });
        window.addEventListener('touchend', this.onTouchEnd.bind(this));

        // สำหรับการทดสอบด้วย Mouse ในคอมพิวเตอร์
        this.el.addEventListener('mousedown', this.onMouseDown.bind(this));
        window.addEventListener('mousemove', this.onMouseMove.bind(this));
        window.addEventListener('mouseup', this.onMouseUp.bind(this));
      },

      // เริ่มแตะหน้าจอ
      onTouchStart: function (evt) {
        if (evt.touches.length === 1) {
          // ตรวจสอบว่าใช้นิ้วแตะโดนโมเดลนี้หรือไม่
          if (this.checkIntersection(evt.touches[0])) {
            this.isDragging = true;
            activeSelectedObject = this.el; // ตั้งค่าเป็นวัตถุหลักที่ถูกเลือก
            updateSliderValue(this.el.object3D.scale.x);
          }
        } else if (evt.touches.length === 2 && activeSelectedObject === this.el) {
          // 2 นิ้ว: โหมด Pinch-to-Zoom
          this.isDragging = false;
          this.initialPinchDistance = this.getDistance(evt.touches[0], evt.touches[1]);
          this.baseScale = Object.assign({}, this.el.object3D.scale);
        }
      },

      // ลากนิ้ว
      onTouchMove: function (evt) {
        if (evt.touches.length === 1 && this.isDragging) {
          evt.preventDefault(); // บล็อกการ Scroll หน้าจอ
          this.moveObject(evt.touches[0].clientX, evt.touches[0].clientY);
        } else if (evt.touches.length === 2 && this.initialPinchDistance && activeSelectedObject === this.el) {
          evt.preventDefault(); // บล็อก Zoom หน้าเว็บของ Browser
          
          let currentDistance = this.getDistance(evt.touches[0], evt.touches[1]);
          let factor = currentDistance / this.initialPinchDistance;

          // คำนวณ Scale ใหม่
          let newScale = Math.max(0.02, Math.min(2.0, this.baseScale.x * factor));
          this.el.object3D.scale.set(newScale, newScale, newScale);
          
          // อัปเดตแถบ Slider ให้ขยับตามนิ้วถ่าง
          updateSliderValue(newScale);
        }
      },

      onTouchEnd: function (evt) {
        if (evt.touches.length < 2) {
          this.initialPinchDistance = null;
        }
        if (evt.touches.length === 0) {
          this.isDragging = false;
        }
      },

      // ฟังก์ชันสำหรับ Mouse (สำหรับ Desktop Test)
      onMouseDown: function (evt) {
        this.isDragging = true;
        activeSelectedObject = this.el;
        updateSliderValue(this.el.object3D.scale.x);
      },
      onMouseMove: function (evt) {
        if (this.isDragging) {
          this.moveObject(evt.clientX, evt.clientY);
        }
      },
      onMouseUp: function () {
        this.isDragging = false;
      },

      // ตรวจสอบว่า Raycaster ส่องโดนตัววัตถุหรือไม่
      checkIntersection: function (touch) {
        let mouse = new THREE.Vector2(
          (touch.clientX / window.innerWidth) * 2 - 1,
          -(touch.clientY / window.innerHeight) * 2 + 1
        );
        let raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, this.camera);
        let intersects = raycaster.intersectObject(this.el.object3D, true);
        return intersects.length > 0;
      },

      // คำนวณตำแหน่ง 3D Space ให้เคลื่อนที่ตามนิ้ว (ทั้งแนวดิ่ง Y และแนวนอน X/Z)
      moveObject: function (clientX, clientY) {
        let mouse = new THREE.Vector2(
          (clientX / window.innerWidth) * 2 - 1,
          -(clientY / window.innerHeight) * 2 + 1
        );

        let raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, this.camera);

        // สร้าง Plane เสมือนขึ้นมารองรับการลากในระนาบกล้อง
        let cameraDir = new THREE.Vector3();
        this.camera.getWorldDirection(cameraDir);
        
        let planePoint = this.camera.position.clone().add(cameraDir.multiplyScalar(2));
        let cameraPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(cameraDir, planePoint);

        let targetPos = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(cameraPlane, targetPos)) {
          if (this.el.parentNode && this.el.parentNode.object3D) {
            this.el.parentNode.object3D.worldToLocal(targetPos);
          }
          this.el.object3D.position.copy(targetPos);
        }
      },

      // ระยะห่างระหว่างนิ้ว 2 นิ้ว
      getDistance: function (t1, t2) {
        let dx = t1.clientX - t2.clientX;
        let dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
    });

    // -------------------------------------------------------------
    // 3. ควบคุม Slider แถบแนวนอนสำหรับปรับขนาด
    // -------------------------------------------------------------
    const slider = document.getElementById('scale-slider');
    
    slider.addEventListener('input', function() {
      if (activeSelectedObject) {
        let val = parseFloat(this.value);
        activeSelectedObject.object3D.scale.set(val, val, val);
      }
    });

    function updateSliderValue(val) {
      slider.value = val;
    }

    // -------------------------------------------------------------
    // 4. ฟังก์ชันสร้างวัตถุใหม่ (Spawn Model)
    // -------------------------------------------------------------
    function spawnModel(type) {
      const container = document.querySelector('#world-container');
      const newEntity = document.createElement('a-entity');

      let initialScale = 0.2;
      if (type === 'banana') {
        newEntity.setAttribute('gltf-model', '#banana-model');
        initialScale = 0.2;
      } else if (type === 'kitchen') {
        newEntity.setAttribute('gltf-model', '#kitchen-model');
        initialScale = 0.08;
      }

      newEntity.setAttribute('scale', `${initialScale} ${initialScale} ${initialScale}`);
      
      const randomX = (Math.random() - 0.5) * 0.8;
      const randomY = (Math.random() - 0.5) * 0.6;
      
      newEntity.setAttribute('position', `${randomX} ${randomY} -1.5`);
      newEntity.setAttribute('class', 'clickable');
      newEntity.setAttribute('ar-touch-controls', '');

      container.appendChild(newEntity);

      // ตั้งค่าโมเดลใหม่ที่สร้างเป็น Active Object ทันที
      activeSelectedObject = newEntity;
      updateSliderValue(initialScale);
    }
  </script>
</body>
</html>

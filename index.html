<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 3D Interactive Model Viewer</title>

  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- AR.js for A-Frame (Marker / Image Tracking) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    /* UI Overlay Control Panel */
    #ui-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 25px;
      backdrop-filter: blur(5px);
    }

    .btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: #2196F3;
    }

    #info-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 8px 18px;
      border-radius: 15px;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      width: 80%;
      max-width: 350px;
    }
  </style>
</head>
<body>

  <!-- Controls GUI -->
  <div id="ui-container">
    <button class="btn" onclick="spawnModel('banana')">🍌 เพิ่ม Banana</button>
    <button class="btn btn-secondary" onclick="spawnModel('kitchen')">🍳 เพิ่ม Kitchen</button>
  </div>

  <div id="info-text">
    ส่องกล้องไปที่ Marker/QR หรือแตะลากวัตถุบนหน้าจอเพื่อเคลื่อนย้าย
  </div>

  <!-- A-Frame Scene -->
  <!-- webxr: enables AR features for mobile surface detection; arjs: handles Hiro/QR Markers -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    webxr="optionalFeatures: hit-test, local-floor;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- Preload 3D Assets -->
    <a-assets>
      <!-- เปลี่ยน path ไฟล์ GLB ของคุณที่นี่ -->
      <a-asset-item id="banana-model" src="Banana.glb"></a-asset-item>
      <a-asset-item id="kitchen-model" src="kitchen.glb"></a-asset-item>
    </a-assets>

    <!-- Camera / Cursor Setup -->
    <a-entity camera look-controlsWASD-controls id="main-camera">
      <!-- Raycaster component for touch/click interaction -->
      <a-entity cursor="fuse: false"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                material="color: #FF5722; shader: flat"
                visible="false">
      </a-entity>
    </a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 0.8;"></a-entity>
    <a-entity light="type: directional; intensity: 0.6;" position="1 4 2"></a-entity>

    <!-- SECTION 1: Image / Marker Tracking (Hiro / Custom Pattern / QR) -->
    <a-marker preset="hiro" id="hiro-marker">
      <!-- Model จะปรากฏขึ้นเมื่อส่องเจอ Hiro Marker -->
      <a-entity 
        id="marker-banana"
        gltf-model="#banana-model" 
        scale="0.2 0.2 0.2" 
        position="0 0 0"
        class="clickable"
        gesture-handler>
      </a-entity>
    </a-marker>

    <!-- SECTION 2: Dynamic Spawn Area for Surface / Free Placement -->
    <a-entity id="world-container" position="0 0 -2"></a-entity>

  </a-scene>

  <!-- JavaScript Interaction Logic -->
  <script>
    // System Component for Touch / Drag & Drop Interaction
    AFRAME.registerComponent('drag-and-drop', {
      init: function () {
        this.el.addEventListener('mousedown', this.onDragStart.bind(this));
        this.el.addEventListener('touchstart', this.onDragStart.bind(this));
        
        window.addEventListener('mousemove', this.onDragMove.bind(this));
        window.addEventListener('touchmove', this.onDragMove.bind(this));

        window.addEventListener('mouseup', this.onDragEnd.bind(this));
        window.addEventListener('touchend', this.onDragEnd.bind(this));

        this.isDragging = false;
        this.camera = document.querySelector('#main-camera').object3D;
      },

      onDragStart: function (evt) {
        this.isDragging = true;
        this.el.setAttribute('scale', this.getScaledUpValue());
      },

      onDragMove: function (evt) {
        if (!this.isDragging) return;

        // คำนวณตำแหน่งพิกัดจากหน้าจอสัมผัสไปยัง AR 3D Space
        let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        let clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        let mouse = new THREE.Vector2(
          (clientX / window.innerWidth) * 2 - 1,
          -(clientY / window.innerHeight) * 2 + 1
        );

        let raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, this.camera);

        // คำนวณระนาบการวางวัตถุบนพื้นระดับ Y = -1
        let plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1);
        let targetPos = new THREE.Vector3();
        
        if (raycaster.ray.intersectPlane(plane, targetPos)) {
          this.el.object3D.position.copy(targetPos);
        }
      },

      onDragEnd: function (evt) {
        if (this.isDragging) {
          this.isDragging = false;
          this.el.setAttribute('scale', this.getOriginalValue());
        }
      },

      getScaledUpValue: function() {
        let currentScale = this.el.getAttribute('scale');
        return `${currentScale.x * 1.1} ${currentScale.y * 1.1} ${currentScale.z * 1.1}`;
      },

      getOriginalValue: function() {
        let currentScale = this.el.getAttribute('scale');
        return `${currentScale.x / 1.1} ${currentScale.y / 1.1} ${currentScale.z / 1.1}`;
      }
    });

    // ฟังก์ชันเพิ่มโมเดลสามมิติลงในฉาก (Dynamic Spawning)
    function spawnModel(type) {
      const container = document.querySelector('#world-container');
      const newEntity = document.createElement('a-entity');

      // กำหนดค่าเริ่มต้นตามประเภทโมเดล
      if (type === 'banana') {
        newEntity.setAttribute('gltf-model', '#banana-model');
        newEntity.setAttribute('scale', '0.3 0.3 0.3');
      } else if (type === 'kitchen') {
        newEntity.setAttribute('gltf-model', '#kitchen-model');
        newEntity.setAttribute('scale', '0.1 0.1 0.1');
      }

      // สุ่มตำแหน่งเล็กน้อยทางด้านหน้าผู้ใช้
      const randomX = (Math.random() - 0.5) * 1.5;
      const randomZ = -1.5 + (Math.random() - 0.5) * 0.5;
      
      newEntity.setAttribute('position', `${randomX} -0.5 ${randomZ}`);
      newEntity.setAttribute('class', 'clickable');
      
      // ติดตั้งระบบ Drag and Drop ให้โมเดล
      newEntity.setAttribute('drag-and-drop', '');

      // เพิ่ม Effect หมุนแบบ Gaming
      newEntity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear');

      container.appendChild(newEntity);
    }
  </script>
</body>
</html>

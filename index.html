<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 3D Interactive Model Viewer</title>

  <!-- A-Frame Version 1.2.0 (รุ่นที่ทำงานเสถียรที่สุดร่วมกับ AR.js) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- AR.js สำหรับ A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
    }

    /* หน้าต่างปุ่มขอสิทธิ์เปิดกล้องแบบแมนนวล เผื่อบราวเซอร์บล็อก */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    /* UI ควบคุม */
    #ui-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 25px;
      backdrop-filter: blur(5px);
    }

    .btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .btn-main {
      background: #e91e63;
      font-size: 18px;
      padding: 15px 30px;
      border-radius: 30px;
    }

    .btn-secondary {
      background: #2196F3;
    }

    #info-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 8px 18px;
      border-radius: 15px;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      width: 80%;
      max-width: 350px;
    }
  </style>
</head>
<body>

  <!-- Overlay สำหรับเปิดใช้งานกล้อง -->
  <div id="start-overlay">
    <h2>แอพพลิเคชัน AR 3D Viewer</h2>
    <p>กดปุ่มด้านล่างเพื่ออนุญาตให้ใช้งานกล้องมือถือ</p>
    <button class="btn btn-main" id="start-btn">📷 เริ่มใช้งานกล้อง</button>
  </div>

  <!-- Controls GUI -->
  <div id="ui-container">
    <button class="btn" onclick="spawnModel('banana')">🍌 เพิ่ม Banana</button>
    <button class="btn btn-secondary" onclick="spawnModel('kitchen')">🍳 เพิ่ม Kitchen</button>
  </div>

  <div id="info-text">
    ส่องกล้องไปที่ Hiro Marker หรือแตะลากวัตถุบนหน้าจอ
  </div>

  <!-- A-Frame Scene
        arjs="sourceType: webcam" ตัวนี้ทำหน้าที่เปิดกล้องมือถือให้อัตโนมัติ -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best; facingMode: environment;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- Assets Preload -->
    <a-assets>
      <a-asset-item id="banana-model" src="Banana.glb"></a-asset-item>
      <a-asset-item id="kitchen-model" src="kitchen.glb"></a-asset-item>
    </a-assets>

    <!-- Camera -->
    <a-entity camera look-controls id="main-camera"></a-entity>

    <!-- Light -->
    <a-entity light="type: ambient; intensity: 0.9;"></a-entity>
    <a-entity light="type: directional; intensity: 0.6;" position="1 4 2"></a-entity>

    <!-- Marker Tracking (ส่องรูป Hiro Marker) -->
    <a-marker preset="hiro" id="hiro-marker">
      <a-entity 
        id="marker-banana"
        gltf-model="#banana-model" 
        scale="0.2 0.2 0.2" 
        position="0 0 0"
        class="clickable"
        drag-and-drop>
      </a-entity>
    </a-marker>

    <!-- Container สำหรับโหมดวางวัตถุบนหน้าจอ / พื้น -->
    <a-entity id="world-container" position="0 0 -2"></a-entity>

  </a-scene>

  <script>
    // -------------------------------------------------------------
    // 1. ระบบจัดการ Permission การเปิดกล้องบนสมาร์ทโฟน
    // -------------------------------------------------------------
    document.getElementById('start-btn').addEventListener('click', async () => {
      try {
        // ขอสิทธิ์ใช้กล้องหลังจากกดปุ่ม
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: { exact: "environment" } } 
        });
        
        // หากได้รับสิทธิ์ ให้ซ่อน Overlay และให้ AR.js ทำงานต่อ
        document.getElementById('start-overlay').style.display = 'none';
        
        // หยุด Stream ชั่วคราวเพื่อให้ AR.js จัดการต่อเอง
        stream.getTracks().forEach(track => track.stop());
      } catch (err) {
        // กรณีอุปกรณ์ไม่มีกล้องหลัง (เช่น ในคอมพิวเตอร์) ให้ลองขอใช้กล้องทั่วไป
        try {
          await navigator.mediaDevices.getUserMedia({ video: true });
          document.getElementById('start-overlay').style.display = 'none';
        } catch (e) {
          alert("ไม่สามารถเข้าถึงกล้องได้ โปรดตรวจสอบการอนุญาตใช้งานกล้องในตั้งค่าบราวเซอร์");
        }
      }
    });

    // -------------------------------------------------------------
    // 2. ระบบ Drag and Drop เคลื่อนย้ายวัตถุบนหน้าจอ
    // -------------------------------------------------------------
    AFRAME.registerComponent('drag-and-drop', {
      init: function () {
        this.el.addEventListener('mousedown', this.onDragStart.bind(this));
        this.el.addEventListener('touchstart', this.onDragStart.bind(this));
        
        window.addEventListener('mousemove', this.onDragMove.bind(this));
        window.addEventListener('touchmove', this.onDragMove.bind(this));

        window.addEventListener('mouseup', this.onDragEnd.bind(this));
        window.addEventListener('touchend', this.onDragEnd.bind(this));

        this.isDragging = false;
        this.camera = document.querySelector('#main-camera').object3D;
      },

      onDragStart: function (evt) {
        this.isDragging = true;
      },

      onDragMove: function (evt) {
        if (!this.isDragging) return;

        let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        let clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        let mouse = new THREE.Vector2(
          (clientX / window.innerWidth) * 2 - 1,
          -(clientY / window.innerHeight) * 2 + 1
        );

        let raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, this.camera);

        let plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 2);
        let targetPos = new THREE.Vector3();
        
        if (raycaster.ray.intersectPlane(plane, targetPos)) {
          this.el.object3D.position.copy(targetPos);
        }
      },

      onDragEnd: function (evt) {
        this.isDragging = false;
      }
    });

    // -------------------------------------------------------------
    // 3. ฟังก์ชันเพิ่มโมเดลสามมิติแบบ Dynamic
    // -------------------------------------------------------------
    function spawnModel(type) {
      const container = document.querySelector('#world-container');
      const newEntity = document.createElement('a-entity');

      if (type === 'banana') {
        newEntity.setAttribute('gltf-model', '#banana-model');
        newEntity.setAttribute('scale', '0.2 0.2 0.2');
      } else if (type === 'kitchen') {
        newEntity.setAttribute('gltf-model', '#kitchen-model');
        newEntity.setAttribute('scale', '0.08 0.08 0.08');
      }

      const randomX = (Math.random() - 0.5) * 1.2;
      const randomY = (Math.random() - 0.5) * 0.8;
      
      newEntity.setAttribute('position', `${randomX} ${randomY} -1.5`);
      newEntity.setAttribute('class', 'clickable');
      newEntity.setAttribute('drag-and-drop', '');

      container.appendChild(newEntity);
    }
  </script>
</body>
</html>
